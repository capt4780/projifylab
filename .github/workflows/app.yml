name: App Projify

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tạo khung dự án
        run: bash scripts/bootstrap.sh
      - name: Kiểm tra code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Chạy test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: projify-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (chưa ký)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tạo khung dự án
        run: bash scripts/bootstrap.sh
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Đóng gói IPA chưa ký
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry projify-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: projify-ios-unsigned
          path: app/projify-ios-unsigned.ipa
